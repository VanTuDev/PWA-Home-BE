services:
  - type: web
    name: paw-home-be
    env: node
    plan: free
    region: singapore          # gần VN nhất trên Render free tier
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000            # Render gán port tự động qua env PORT

      # ── Cloudinary ───────────────────────────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        value: dr9s2bpyf
      - key: CLOUDINARY_API_KEY
        value: "853727358796382"
      - key: CLOUDINARY_API_SECRET
        sync: false             # điền trong Render Dashboard

      # ── Database ─────────────────────────────────────────────────────────
      - key: MONGO_URI
        sync: false             # điền trong Render Dashboard

      - key: JWT_SECRET
        sync: false             # điền trong Render Dashboard

      # ── Admin mặc định ───────────────────────────────────────────────────
      - key: ADMIN_EMAIL
        value: Vantu.dev@gmail.com
      - key: ADMIN_PASSWORD
        sync: false             # điền trong Render Dashboard

      # ── CORS / URLs ───────────────────────────────────────────────────────
      - key: FE_ORIGIN
        value: https://pwa-home.vercel.app
      - key: FE_URL
        value: https://pwa-home.vercel.app

      # ── VNPay ────────────────────────────────────────────────────────────
      - key: VNPAY_TMN_CODE
        value: H76TXFJD
      - key: VNPAY_HASH_SECRET
        sync: false             # điền trong Render Dashboard
      - key: VNPAY_URL
        value: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      # Thay YOUR_RENDER_URL bằng URL thực sau khi deploy
      - key: VNPAY_RETURN_URL
        value: https://YOUR_RENDER_URL.onrender.com/api/orders/vnpay_return
      - key: VNPAY_IPN_URL
        value: https://YOUR_RENDER_URL.onrender.com/api/orders/vnpay_ipn

      # ── Email SMTP ────────────────────────────────────────────────────────
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: Vantu.dev@gmail.com
      - key: SMTP_PASS
        sync: false             # điền trong Render Dashboard (App Password Gmail)
